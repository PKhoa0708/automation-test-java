name: Maven CI/CD

on:
  push:
    branches:
      - main
      - feature/login-pom
  pull_request:
    branches:
      - main
      - feature/login-pom

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 # Required for SonarCloud or other tools that need full history
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Install Google Chrome
      run: |
        sudo apt-get update
        sudo apt-get install google-chrome-stable -y
    - name: Build with Maven
      run: mvn -B package --file pom.xml
    - name: Run tests
      run: mvn test